name: 📤 Отправить сейчас

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-send
  cancel-in-progress: false

jobs:
  send-now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Пинг — кнопка сработала
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=🚀 Кнопка нажата, разбираю расписание…"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установить Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Отправить расписание
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_CLASS: ${{ vars.MY_CLASS || secrets.MY_CLASS || '11а' }}
        run: |
          set -o pipefail
          python bot.py 2>&1 | tee bot.log

      - name: Если упало — прислать причину
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TAIL=$(tail -c 600 bot.log 2>/dev/null | sed "s/$BOT_TOKEN/***/g")
          [ -z "$TAIL" ] && TAIL="упало до запуска бота (установка зависимостей или сам файл bot.py)"
          MSG=$(printf '❌ Не получилось:\n%s\n\n%s' "$TAIL" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$MSG"

name: 📤 Отправить сейчас

on:
  workflow_dispatch:          # только по кнопке, никакого расписания

permissions:
  contents: read              # писать в репозиторий запрещено

concurrency:
  group: manual-send          # своя очередь, боевой workflow не задевает
  cancel-in-progress: false

jobs:
  send-now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установить Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Отправить расписание сейчас
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_CLASS: ${{ vars.MY_CLASS || secrets.MY_CLASS || '11а' }}
        run: python bot.py

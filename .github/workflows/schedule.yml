name: Отправить расписание

on:
  schedule:
    - cron: '5 13 * * *'
  workflow_dispatch:

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v3

      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Установить библиотеки
        run: |
          pip install pymupdf requests pandas

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_CLASS: ${{ secrets.MY_CLASS }}
        run: python bot.py

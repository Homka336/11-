name: Send schedule

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install libs
        run: |
          pip install pymupdf requests pandas

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_CLASS: ${{ secrets.MY_CLASS }}
        run: python bot.py

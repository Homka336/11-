name: Отправить расписание

on:
  schedule:
    # Утренние UTC = 11:00–14:00 МСК. При типичной задержке 5–10 ч
    # запуск приземлится в 16:00–24:00 МСК — как раз в окно отправки.
    - cron: '0 8-11 * * *'
    # Дневные UTC = 15:30–19:30 МСК — на случай, если GitHub сработает вовремя.
    - cron: '30 12-16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить принудительно (игнорировать окно и .last-sent)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Надо ли отправлять?
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          D=$(TZ=Europe/Moscow date +%F)
          H=$(TZ=Europe/Moscow date +%-H)
          LAST=$(cat .last-sent 2>/dev/null || echo "")
          echo "Сейчас по МСК: $(TZ=Europe/Moscow date '+%d.%m %H:%M'), последняя отправка: ${LAST:-никогда}"
          GO=no
          if [ "$H" -ge 15 ] && [ "$H" -le 23 ] && [ "$LAST" != "$D" ]; then GO=yes; fi
          if [ "$FORCE" = "true" ]; then GO=yes; fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "day=$D" >> "$GITHUB_OUTPUT"

      - name: Установить Python
        if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установить Tesseract (OCR)
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Установить библиотеки
        if: steps.gate.outputs.go == 'yes'
        run: pip install -r requirements.txt

      - name: Отправить расписание
        if: steps.gate.outputs.go == 'yes'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MY_CLASS: ${{ vars.MY_CLASS || secrets.MY_CLASS || '11а' }}
          PDF_URL: ${{ vars.PDF_URL }}
        run: python bot.py

      - name: Отметить, что отправлено
        if: steps.gate.outputs.go == 'yes'
        run: |
          echo "${{ steps.gate.outputs.day }}" > .last-sent
          git config user.name  "schedule-bot"
          git config user.email "actions@github.com"
          git add .last-sent
          git commit -m "расписание отправлено ${{ steps.gate.outputs.day }}"
          git pull --rebase origin main
          git push
